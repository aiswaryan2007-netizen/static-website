<!DOCTYPE html>
<html>
    <head>
        <title>Contact</title>
        <link rel="stylesheet" href="boss.css">
    </head>
    <body>
        <div class="form">
            <div class="formchild">
        <h3>Your contact</h3>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
            <label for="age">Your Age:</label>
            <input type="number" id="age" name="age" placeholder="Enter your age"><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" placeholder="Enter your password"><br><br>
            <label for="clg">College:</label>
            <input type="text" id="clg" name="clg" placeholder="Enter your college"><br><br>
            <input type="radio" id="male" name="gender">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label><br><br>
            <input type="checkbox" id="python" name="python">
            <label for="python">Python</label>
            <input type="checkbox" id="cpp" name="cpp">
            <label for="cpp">C++</label>
            <input type="checkbox" id="c" name="c">
            <label for="c">C</label>
            <input type="checkbox" id="java" name="java">
            <label for="java">Java</label><br><br>
            <label for="ph">Phone No:</label>
            <input type="tel" id="ph" placeholder="Enter your phone number"><br><br>
            <button type="submit">Submit</button>
        </form>
        </div>
        </div>
    </body>
</html>
